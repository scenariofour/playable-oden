<style>
  :root {
    --toy: #fff8ef; --toy-lip: #ead8c8; --toy-ink: #4d3d52; --toy-mute: rgba(77, 61, 82, 0.58); --toy-press: #f4e8dc; --coral: #df7558; --coral-lip: #b85a42;
    --paper: #fffaf1; --rule: rgba(77, 61, 82, 0.2);
    --ui-font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", "Nunito", sans-serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #231d24; overscroll-behavior: none; color: var(--toy-ink);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; }
  body.framed { background: #17131c; }
  body.framed #stage { inset: auto; left: 50%; top: 50%; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; translate: -50% -50%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  canvas.is-hot { cursor: pointer; }
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse 80% 72% at 46% 48%, transparent 52%, rgba(18, 10, 20, 0.48) 100%); }
  body.no-ui #slip, body.no-ui #hint, body.no-ui #toast, body.no-ui #cartBtn, body.no-ui #added { display: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

  /* ---- the order slip: a paper ticket ---- */
  #slip { position: absolute; z-index: 3; right: 16px; top: 72px; width: 312px; max-height: calc(100% - 88px); display: flex; flex-direction: column;
    background: var(--paper); border-radius: 16px 16px 8px 8px; font: 500 14px/1.3 var(--ui-font);
    box-shadow: 0 3px 0 var(--toy-lip), 0 16px 34px rgba(30, 18, 34, 0.34); transition: transform 0.35s var(--ease-out); }
  #slip.bump { animation: slipbump 0.45s var(--ease-out); }
  @keyframes slipbump { 30% { transform: translateY(-3px) rotate(-0.4deg); } }
  .slip-head { display: flex; align-items: center; gap: 9px; padding: 14px 16px 11px; border: 0; background: none; text-align: left; width: 100%; cursor: default; border-bottom: 1.5px dashed var(--rule); }
  .slip-stamp { font: 900 12px/1 var(--ui-font); color: #fff; background: var(--coral); border-radius: 7px; padding: 5px 6px 4px; letter-spacing: 0.04em; }
  .slip-title { font: 900 17px/1 var(--ui-font); letter-spacing: 0.01em; }
  .slip-head > * { white-space: nowrap; }
  .slip-count { margin-left: auto; color: var(--toy-mute); font-size: 12px; font-weight: 700; }
  .chev { display: none; transform-origin: 50% 50%; width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: rotate 0.3s var(--ease-out); }
  #lines { list-style: none; margin: 0; padding: 6px 8px; overflow: auto; }
  .line { display: grid; grid-template-columns: 20px 1fr auto 46px; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 11px; }
  .line.bump { animation: linebump 0.7s var(--ease-out); }
  @keyframes linebump { 0% { background: #ffe2c4; } 100% { background: transparent; } }
  .ic { width: 20px; height: 20px; display: block; }
  .nm { min-width: 0; } .nm b { font-weight: 700; } .nm small { display: block; color: var(--toy-mute); font-size: 11px; margin-top: 1px; }
  .nm .pend { color: var(--coral); font-weight: 700; }
  .step { display: flex; align-items: center; gap: 1px; background: #f3e7da; border-radius: 10px; padding: 2px; }
  .step button { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; font: 900 16px/1 var(--ui-font); cursor: pointer; display: grid; place-items: center; }
  .step button:hover:not(:disabled) { background: #fff; }
  .step button:disabled { opacity: 0.3; cursor: default; }
  .step .q { min-width: 20px; text-align: center; font-weight: 900; font-variant-numeric: tabular-nums; }
  .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .empty { margin: 14px 18px 16px; color: var(--toy-mute); line-height: 1.45; }
  .empty b { color: var(--toy-ink); }
  .slip-foot { padding: 11px 16px 14px; border-top: 1.5px dashed var(--rule); }
  .credit { margin: 9px 0 0; } .credit a { color: inherit; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; }
  .total span { color: var(--toy-mute); font-weight: 700; font-size: 12px; }
  .total b { font: 900 23px/1 var(--ui-font); font-variant-numeric: tabular-nums; }
  #done { width: 100%; margin-top: 11px; padding: 12px 12px 11px; border: 0; border-radius: 13px; background: var(--coral); color: #fff; font: 900 15px/1 var(--ui-font);
    box-shadow: 0 3px 0 var(--coral-lip); cursor: pointer; transition: transform 0.1s; }
  #done:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--coral-lip); }
  #done:disabled { background: #e6d9cc; box-shadow: 0 3px 0 #d6c5b6; cursor: default; }
  #done small { display: block; font-weight: 700; font-size: 11px; opacity: 0.85; margin-top: 3px; }
  .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; }
  .linkbtn { border: 0; background: none; padding: 4px 2px; font-weight: 700; font-size: 12px; color: var(--toy-ink); cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
  .linkbtn:disabled { opacity: 0.35; cursor: default; }
  .linkbtn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fine { color: var(--toy-mute); font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; }
  /* the menu strip: hidden on wide screens (the price cards stand in the case), chips in the phone sheet */
  .menu { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .chip { position: relative; flex: 0 0 auto; display: grid; grid-template-columns: 24px auto; align-items: center; gap: 7px; min-width: 88px; height: 50px;
    padding: 0 12px 0 9px; border: 0; border-radius: 13px; background: #f3e7da; box-shadow: 0 2px 0 #e2cfbd; cursor: pointer; text-align: left;
    transition: transform 0.12s var(--ease-out), background 0.2s; }
  .chip:active { transform: translateY(2px) scale(0.97); box-shadow: 0 0 0 #e2cfbd; background: #fde6cf; }
  .chip .ic { width: 24px; height: 24px; }
  .chip .cn b { display: block; font: 900 14px/1.1 var(--ui-font); white-space: nowrap; } .chip .cn small { display: block; font: 700 12px/1.2 var(--ui-font); color: var(--toy-mute); font-variant-numeric: tabular-nums; }
  .chip .badge { position: absolute; top: -6px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px;
    background: var(--coral); color: #fff; font: 900 11.5px/20px var(--ui-font); text-align: center; box-shadow: 0 2px 4px rgba(184, 90, 66, 0.35); }
  .chip .badge[hidden] { display: none; }
  .chip.out { opacity: 0.55; }


  /* ---- the shop: cart button, "added" note, cart drawer, checkout ----
     The station is playful; the shop is plain, familiar web-shop UI in the same colours and type. */
  #cartBtn { position: absolute; z-index: 4; right: 16px; top: 16px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 13px; border: 0; border-radius: 22px;
    background: var(--paper); color: var(--toy-ink); font: 900 15px/1 var(--ui-font); cursor: pointer; box-shadow: 0 3px 0 var(--toy-lip), 0 10px 22px rgba(30, 18, 34, 0.3); }
  #cartBtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round; stroke-linecap: round; }
  #cartBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--toy-lip), 0 6px 14px rgba(30, 18, 34, 0.3); }
  .cb-badge { min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: var(--coral); color: #fff; font: 900 12.5px/22px var(--ui-font); text-align: center; }
  .cb-badge[hidden] { display: none; }
  #cartBtn.bump { animation: cartbump 0.5s var(--ease-out); }
  @keyframes cartbump { 30% { transform: scale(1.12) rotate(-3deg); } 60% { transform: scale(0.97); } }
  .flyer { position: fixed; z-index: 20; border-radius: 50%; object-fit: cover; pointer-events: none; box-shadow: 0 10px 24px rgba(30, 18, 34, 0.4); }
  #added { position: absolute; z-index: 6; right: 16px; top: 68px; width: 300px; padding: 12px; box-sizing: border-box; border-radius: 10px; background: #fff;
    font: 500 13px/1.3 var(--ui-font); box-shadow: 0 12px 30px rgba(30, 18, 34, 0.35); animation: drop 0.3s var(--ease-out); }
  #added[hidden] { display: none; }
  @keyframes drop { 0% { transform: translateY(-8px); opacity: 0; } }
  .ad-top { display: grid; grid-template-columns: 44px 1fr 28px; gap: 10px; align-items: center; }
  .ad-top img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  .ad-top b { display: block; font-weight: 900; font-size: 14px; color: #2f7d68; } .ad-top small { color: var(--toy-mute); font-weight: 700; font-size: 12px; }
  .ad-act { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .ad-act button { margin: 0; padding: 10px 8px; font-size: 13.5px; }

  .btn-primary { display: block; width: 100%; margin-top: 16px; padding: 14px 12px; border: 0; border-radius: 8px; background: var(--coral); color: #fff; font: 900 15px/1 var(--ui-font); cursor: pointer; }
  .btn-primary:hover:not(:disabled) { background: #d4684c; }
  .btn-primary:disabled { opacity: 0.75; cursor: default; }
  .btn-secondary { display: block; width: 100%; padding: 11px 12px; border: 1px solid #cdbcab; border-radius: 8px; background: #fff; color: var(--toy-ink); font: 700 14px/1 var(--ui-font); cursor: pointer; }
  .btn-link { border: 0; background: none; padding: 4px 0; color: var(--toy-ink); font: 700 13px/1.2 var(--ui-font); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .sh-x { width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--toy-ink); }
  .sh-x:hover { background: #f1e6da; }
  .sh-x svg, .ck-back svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fine { color: var(--toy-mute); font-size: 11.5px; font-weight: 700; }

  #scrim { position: absolute; inset: 0; z-index: 8; background: rgba(23, 15, 25, 0.5); animation: fade 0.2s ease-out; }
  #scrim[hidden] { display: none; }
  @keyframes fade { 0% { opacity: 0; } }
  body.shopping #hint, body.shopping #toast, body.shopping #added { display: none; }
  #cart, #checkout { color: var(--toy-ink); font: 500 14px/1.4 var(--ui-font); }
  #cart { position: absolute; z-index: 9; top: 0; right: 0; bottom: 0; width: min(420px, 100%); display: flex; flex-direction: column; background: #fff; box-shadow: -12px 0 32px rgba(20, 12, 24, 0.3); animation: slidein 0.28s var(--ease-out); }
  #cart[hidden] { display: none; }
  @keyframes slidein { 0% { transform: translateX(32px); opacity: 0; } }
  .sh-head { display: flex; align-items: center; gap: 10px; padding: 16px 14px 14px 20px; border-bottom: 1px solid #eadfd3; }
  .sh-head h2 { margin: 0; font: 900 19px/1 var(--ui-font); outline: none; }
  .sh-sub { color: var(--toy-mute); font-weight: 700; font-size: 13px; }
  .sh-head .sh-x { margin-left: auto; }
  .sh-body { flex: 1; overflow: auto; padding: 0 20px; }
  .sh-foot { padding: 14px 20px 18px; border-top: 1px solid #eadfd3; }
  .sh-foot[hidden] { display: none; }
  .sh-foot .row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
  .sh-foot .row b { font: 900 19px/1 var(--ui-font); }
  .sh-foot .fine { margin: 6px 0 0; } .sh-foot .btn-primary { margin-top: 14px; } .sh-foot .btn-link { display: block; margin: 10px auto 0; }
  .cart-list { list-style: none; margin: 0; padding: 0; }
  .ci { display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 16px 0; border-bottom: 1px solid #f0e7dd; }
  .ci-img, .ck-img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: #3a2b2a; }
  .ph { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 2px; padding: 12px; box-sizing: border-box; background: #f3e7da; }
  .ci-main { min-width: 0; }
  .ci-top { display: flex; justify-content: space-between; gap: 10px; } .ci-top b { font-weight: 900; } .ci-top span { font-weight: 900; font-variant-numeric: tabular-nums; }
  .ci-sub { margin: 2px 0 6px; color: var(--toy-mute); font-size: 12px; font-weight: 700; }
  .ci-items { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12.5px; font-weight: 700; }
  .ci-items li { display: inline-flex; align-items: center; gap: 4px; } .ci-items .ic { width: 14px; height: 14px; } .ci-items small { color: var(--toy-mute); }
  .ci-act { display: flex; gap: 16px; margin-top: 8px; } .ci-act .btn-link { font-size: 12.5px; }
  .cart-empty { display: grid; justify-items: center; gap: 6px; padding: 48px 12px; text-align: center; color: var(--toy-mute); }
  .cart-empty[hidden] { display: none; }
  .cart-empty svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; opacity: 0.6; }
  .cart-empty b { color: var(--toy-ink); font-size: 16px; } .cart-empty .btn-secondary { width: auto; padding: 11px 20px; margin-top: 10px; }

  /* the checkout: a page of its own, form on the left, summary on a tinted column on the right */
  #checkout { position: absolute; inset: 0; z-index: 10; overflow: auto; background: linear-gradient(90deg, #fff 0 55%, #f7efe6 55%); animation: fade 0.2s ease-out; }
  #checkout[hidden] { display: none; }
  .ck-top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: var(--paper); border-bottom: 1px solid #eadfd3; }
  .ck-back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 6px 4px; font: 700 13.5px/1 var(--ui-font); color: var(--toy-ink); cursor: pointer; }
  .ck-back[hidden] { display: none; }
  .ck-brand { font: 900 16px/1 var(--ui-font); }
  .ck-demo { flex: none; white-space: nowrap; padding: 4px 8px; border-radius: 4px; background: #eef4ee; color: #2f5d4f; font: 900 11px/1 var(--ui-font); letter-spacing: 0.06em; text-transform: uppercase; }
  .ck-top .sh-x { margin-left: auto; }
  .ck-wrap { display: grid; grid-template-columns: 55fr 45fr; min-height: calc(100% - 59px); }
  .ck-main { padding: 8px 48px 48px 28px; } .ck-main > * { max-width: 560px; margin-left: auto; }
  .ck-side { padding: 28px 28px 40px 48px; border-left: 1px solid #eadfd3; }
  .ck-side > div { position: sticky; top: 84px; max-width: 380px; }
  .ck-sum-m { display: none; }
  #ck-form section { padding: 18px 0 6px; }
  .ck-h2row { display: flex; justify-content: space-between; align-items: baseline; }
  .ck-h2 { margin: 0 0 12px; font: 900 17px/1.2 var(--ui-font); } .ck-h2 small { color: var(--toy-mute); font-size: 12px; font-weight: 700; margin-left: 4px; }
  section > .ck-h2 + .radios, section > .radios { margin-bottom: 4px; }
  .fld { margin-bottom: 12px; }
  .fld label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 700; } .fld label small { color: var(--toy-mute); font-weight: 700; }
  .fld input, .fld select, .check select { width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid #d6c7b7; border-radius: 6px; background: #fff; color: var(--toy-ink); font: 500 15px/1 var(--ui-font); }
  .fld input:focus, .fld select:focus, .check select:focus { outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px rgba(223, 117, 88, 0.2); }
  .fld input[aria-invalid], .fld select[aria-invalid] { border-color: #c2412a; }
  .hint { margin: 5px 0 0; color: var(--toy-mute); font-size: 12.5px; font-weight: 700; } .hint .ok { color: #2f7d68; }
  .err { margin: 4px 0 0; color: #b0402a; font-size: 12.5px; font-weight: 700; } .err:empty { display: none; }
  .radios { border: 1px solid #d6c7b7; border-radius: 6px; overflow: hidden; background: #fff; }
  .radio { display: flex; align-items: center; gap: 12px; padding: 13px 14px; cursor: pointer; }
  .radio + .radio { border-top: 1px solid #eadfd3; }
  .radio:has(input:checked) { background: #fff6f0; box-shadow: inset 0 0 0 1px var(--coral); }
  .radio input { flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--coral); }
  .radio-t { flex: 1; min-width: 0; } .radio-t b { display: block; font-weight: 900; } .radio-t small { display: block; color: var(--toy-mute); font-size: 12.5px; font-weight: 700; margin-top: 2px; }
  .radio-m { font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .radios + .err + .fld, .radios + .err + .hint, .radios + .fld { margin-top: 14px; }
  .checks { display: grid; gap: 8px; }
  .check { display: flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--coral); }
  .check select { width: 80px; height: 36px; margin-left: auto; }
  .ck-paynote { margin: 10px 0 0; padding: 11px 13px; border-radius: 6px; background: #f7efe6; color: var(--toy-mute); font-size: 12.5px; font-weight: 700; }
  .ck-demo-note { margin: 18px 0 0; padding: 11px 13px; border-radius: 6px; background: #eef4ee; color: #2f5d4f; font-size: 12.5px; font-weight: 700; line-height: 1.45; }
  .ck-formerr { margin-top: 12px; }
  .spin { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, 0.45); border-top-color: #fff; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { rotate: 360deg; } }
  .ck-items { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 12px; }
  .ck-items li { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; }
  .ck-items .ck-img { width: 56px; height: 56px; } .ck-items .ph .ic { width: 11px; height: 11px; }
  .ck-it b { display: block; font-weight: 900; font-size: 13.5px; } .ck-it small { color: var(--toy-mute); font-weight: 700; font-size: 12px; }
  .ck-pr { font-weight: 900; font-variant-numeric: tabular-nums; }
  .ck-rows { border-top: 1px solid #e3d6c8; padding-top: 10px; }
  .ck-rows > div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ck-rows > div small { color: var(--toy-mute); font-size: 11.5px; }
  .ck-rows .ck-total { margin-top: 6px; padding-top: 12px; border-top: 1px solid #e3d6c8; font-weight: 900; font-size: 15px; }
  .ck-total span:last-child { font-size: 21px; } .ck-total small { font-size: 11px; color: var(--toy-mute); margin-right: 4px; }
  .ck-taxnote { margin: 2px 0 0; color: var(--toy-mute); font-size: 12px; font-weight: 700; }
  #ck-done { padding-top: 24px; }
  .ck-eyebrow { margin: 0; color: var(--toy-mute); font-weight: 700; font-size: 13px; }
  .ck-done-h { margin: 4px 0 12px; font: 900 24px/1.2 var(--ui-font); outline: none; }
  .ck-demo-note.strong { margin-top: 0; font-size: 13.5px; }
  .ck-demo-note.ck-sim { margin: 16px 0 0; } .ck-sim b { font-weight: 900; }
